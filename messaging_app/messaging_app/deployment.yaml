apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: django-messaging-app
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: django-messaging
      template:
        metadata:
          labels:
            app: django-messaging
        spec:
          containers:
          - name: django-app
            image: mikiast01/django-messaging-app:latest 
            ports:
            - containerPort: 8000
            envFrom:
            - configMapRef:
                name: django-env
            - secretRef:
                name: django-secrets
            command: ["python3", "manage.py", "runserver", "0.0.0.0:8000"]
          restartPolicy: Always

    ---
    apiVersion: v1
    kind: Service
    metadata:
      name: django-messaging-service
    spec:
      selector:
        app: django-messaging
      ports:
      - port: 8000
        targetPort: 8000
      type: ClusterIP